<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#102b50"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="18" fill="#9bcaff" letter-spacing="3">TRUVA / AI SECURITY</text><text x="64" y="140" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="white">A proposal is not an instruction to execute.</text><text x="64" y="185" font-family="Arial,sans-serif" font-size="22" fill="#d3e1f1">Keep the authorization decision outside the model.</text><rect x="64" y="245" width="342" height="255" rx="12" fill="#f1f6fc"/><text x="88" y="293" font-family="Arial,sans-serif" font-size="20" fill="#a44012" font-weight="700">01</text><text x="88" y="340" font-family="Arial,sans-serif" font-size="25" fill="#102b50" font-weight="700">Propose</text><text x="88" y="386" font-family="Arial,sans-serif" font-size="20" fill="#334b64">Agent prepares a specific</text><text x="88" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334b64">operation with a target</text><text x="88" y="450" font-family="Arial,sans-serif" font-size="20" fill="#334b64">and parameters.</text><rect x="429" y="245" width="342" height="255" rx="12" fill="#f1f6fc"/><text x="453" y="293" font-family="Arial,sans-serif" font-size="20" fill="#a44012" font-weight="700">02</text><text x="453" y="340" font-family="Arial,sans-serif" font-size="25" fill="#102b50" font-weight="700">Bind approval</text><text x="453" y="386" font-family="Arial,sans-serif" font-size="20" fill="#334b64">Approval records exact</text><text x="453" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334b64">details, tool and expiry;</text><text x="453" y="450" font-family="Arial,sans-serif" font-size="20" fill="#334b64">changes need reapproval.</text><rect x="794" y="245" width="342" height="255" rx="12" fill="#f1f6fc"/><text x="818" y="293" font-family="Arial,sans-serif" font-size="20" fill="#a44012" font-weight="700">03</text><text x="818" y="340" font-family="Arial,sans-serif" font-size="25" fill="#102b50" font-weight="700">Check and execute</text><text x="818" y="386" font-family="Arial,sans-serif" font-size="20" fill="#334b64">Independent gate checks</text><text x="818" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334b64">current authority and</text><text x="818" y="450" font-family="Arial,sans-serif" font-size="20" fill="#334b64">prevents duplicate action.</text><rect x="64" y="549" width="1072" height="64" rx="8" fill="#ffdfc7"/><text x="88" y="589" font-family="Arial,sans-serif" font-size="23" fill="#713111">Changed, expired or revoked authority? Deny before execution.</text></svg>