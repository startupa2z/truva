<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#102b50"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="18" fill="#9bcaff" letter-spacing="3">TRUVA / AI SECURITY</text><text x="64" y="140" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="white">Access is only the beginning.</text><text x="64" y="185" font-family="Arial,sans-serif" font-size="22" fill="#d3e1f1">Three separate questions before an agent acts.</text><rect x="64" y="245" width="342" height="255" rx="12" fill="#f1f6fc"/><text x="88" y="293" font-family="Arial,sans-serif" font-size="20" fill="#a44012" font-weight="700">01</text><text x="88" y="340" font-family="Arial,sans-serif" font-size="25" fill="#102b50" font-weight="700">Account access</text><text x="88" y="386" font-family="Arial,sans-serif" font-size="20" fill="#334b64">Did the customer allow</text><text x="88" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334b64">this account and data</text><text x="88" y="450" font-family="Arial,sans-serif" font-size="20" fill="#334b64">to be accessed?</text><rect x="429" y="245" width="342" height="255" rx="12" fill="#f1f6fc"/><text x="453" y="293" font-family="Arial,sans-serif" font-size="20" fill="#a44012" font-weight="700">02</text><text x="453" y="340" font-family="Arial,sans-serif" font-size="25" fill="#102b50" font-weight="700">Access method</text><text x="453" y="386" font-family="Arial,sans-serif" font-size="20" fill="#334b64">Does the provider permit</text><text x="453" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334b64">this integration or</text><text x="453" y="450" font-family="Arial,sans-serif" font-size="20" fill="#334b64">method of access?</text><rect x="794" y="245" width="342" height="255" rx="12" fill="#f1f6fc"/><text x="818" y="293" font-family="Arial,sans-serif" font-size="20" fill="#a44012" font-weight="700">03</text><text x="818" y="340" font-family="Arial,sans-serif" font-size="25" fill="#102b50" font-weight="700">Exact action</text><text x="818" y="386" font-family="Arial,sans-serif" font-size="20" fill="#334b64">Did the customer approve</text><text x="818" y="418" font-family="Arial,sans-serif" font-size="20" fill="#334b64">this operation, target</text><text x="818" y="450" font-family="Arial,sans-serif" font-size="20" fill="#334b64">and amount?</text><rect x="64" y="549" width="1072" height="64" rx="8" fill="#ffdfc7"/><text x="88" y="589" font-family="Arial,sans-serif" font-size="23" fill="#713111">One permission does not automatically grant the others.</text></svg>