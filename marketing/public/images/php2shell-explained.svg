<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1200" height="675" rx="18" fill="#19385f"/><circle cx="1130" cy="20" r="210" fill="#254974"/><text x="52" y="57" fill="#ffa46f" font-size="18" font-weight="700" letter-spacing="2">PHP2SHELL, EXPLAINED</text><text x="52" y="116" fill="white" font-size="42" font-weight="700">A visitor asks. PHP does the work.</text><text x="52" y="156" fill="#dce8fa" font-size="23">The security boundary is inside the software serving your website.</text>
<path d="M360 335 H416 M762 335 H818" stroke="#ffa46f" stroke-width="4"/>
<rect x="52" y="210" width="308" height="238" rx="14" fill="white"/><rect x="416" y="210" width="346" height="238" rx="14" fill="#fff4eb"/><rect x="818" y="210" width="330" height="238" rx="14" fill="white"/>
<circle cx="90" cy="252" r="19" fill="#ef7832"/><text x="90" y="259" fill="white" text-anchor="middle" font-size="22" font-weight="700">1</text><text x="123" y="259" fill="#19385f" font-size="26" font-weight="700">Visitor</text><rect x="80" y="293" width="252" height="48" rx="6" fill="#edf2f9"/><text x="101" y="324" fill="#19385f" font-size="22">“Show me this page.”</text><text x="80" y="383" fill="#41546d" font-size="21">An ordinary web request.</text><text x="80" y="415" fill="#41546d" font-size="21">No login may be needed.</text>
<circle cx="454" cy="252" r="19" fill="#ef7832"/><text x="454" y="259" fill="white" text-anchor="middle" font-size="22" font-weight="700">2</text><text x="487" y="259" fill="#19385f" font-size="26" font-weight="700">PHP worker</text><text x="444" y="314" fill="#19385f" font-size="23" font-weight="700">Handles web requests.</text><text x="444" y="359" fill="#41546d" font-size="21">Two memory bugs can let</text><text x="444" y="391" fill="#41546d" font-size="21">an attacker make it run</text><text x="444" y="423" fill="#41546d" font-size="21">code it should never run.</text>
<circle cx="856" cy="252" r="19" fill="#ef7832"/><text x="856" y="259" fill="white" text-anchor="middle" font-size="22" font-weight="700">3</text><text x="889" y="259" fill="#19385f" font-size="26" font-weight="700">Your website</text><text x="846" y="314" fill="#19385f" font-size="23" font-weight="700">Data and business activity.</text><text x="846" y="359" fill="#41546d" font-size="21">The impact depends on</text><text x="846" y="391" fill="#41546d" font-size="21">what the PHP process</text><text x="846" y="423" fill="#41546d" font-size="21">can access and change.</text>
<rect x="52" y="484" width="1096" height="111" rx="12" fill="#edf2f9"/><text x="80" y="526" fill="#19385f" font-size="27" font-weight="700">The repair: update PHP, then restart the workers.</text><text x="80" y="565" fill="#41546d" font-size="22">A website firewall can help filter attacks. It does not fix the PHP software.</text><text x="52" y="641" fill="#dce8fa" font-size="17">Primary advisories checked 21 October 2026</text><text x="1148" y="641" text-anchor="end" fill="#ffa46f" font-size="18" font-weight="700">TRUVA SOLUTIONS</text></svg>