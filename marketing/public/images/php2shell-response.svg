<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1200" height="675" rx="18" fill="#edf2f9"/><text x="52" y="56" fill="#a54413" font-size="18" font-weight="700" letter-spacing="2">THE RESPONSE, MADE PRACTICAL</text><text x="52" y="111" fill="#19385f" font-size="41" font-weight="700">Find it. Fix it. Check the running service.</text><rect x="52" y="155" width="528" height="186" rx="12" fill="white" stroke="#d1dcea"/><circle cx="89" cy="197" r="19" fill="#ef7832"/><text x="89" y="204" text-anchor="middle" fill="white" font-size="22" font-weight="700">1</text><text x="122" y="205" fill="#19385f" font-size="28" font-weight="700">Find the runtime</text><text x="80" y="259" fill="#41546d" font-size="23">List every exposed PHP service.</text><text x="80" y="293" fill="#41546d" font-size="23">Check the host, container, and owner.</text><rect x="620" y="155" width="528" height="186" rx="12" fill="white" stroke="#d1dcea"/><circle cx="657" cy="197" r="19" fill="#ef7832"/><text x="657" y="204" text-anchor="middle" fill="white" font-size="22" font-weight="700">2</text><text x="690" y="205" fill="#19385f" font-size="28" font-weight="700">Install the fix</text><text x="648" y="259" fill="#41546d" font-size="23">Use a patched package or image.</text><text x="648" y="293" fill="#41546d" font-size="23">Keep the vendor’s build identifier.</text><rect x="52" y="367" width="528" height="186" rx="12" fill="white" stroke="#d1dcea"/><circle cx="89" cy="409" r="19" fill="#ef7832"/><text x="89" y="416" text-anchor="middle" fill="white" font-size="22" font-weight="700">3</text><text x="122" y="417" fill="#19385f" font-size="28" font-weight="700">Restart every worker</text><text x="80" y="471" fill="#41546d" font-size="23">Replace old workers and containers.</text><text x="80" y="505" fill="#41546d" font-size="23">Make sure no old instance remains.</text><rect x="620" y="367" width="528" height="186" rx="12" fill="white" stroke="#d1dcea"/><circle cx="657" cy="409" r="19" fill="#ef7832"/><text x="657" y="416" text-anchor="middle" fill="white" font-size="22" font-weight="700">4</text><text x="690" y="417" fill="#19385f" font-size="28" font-weight="700">Verify and review</text><text x="648" y="471" fill="#41546d" font-size="23">Test the website and running build.</text><text x="648" y="505" fill="#41546d" font-size="23">Review logs for signs of compromise.</text><text x="52" y="608" fill="#19385f" font-size="23" font-weight="700">Keep evidence from the actual web worker, not only the command line.</text><text x="1148" y="645" text-anchor="end" fill="#a54413" font-size="18" font-weight="700">TRUVA SOLUTIONS</text></svg>