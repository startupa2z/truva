upstream truva_backend {
  server backend:8000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /blog.html { return 301 /security-hub/guides; }
  location = /blog/ai-security-checklist.html { return 301 /blog/top-10-ai-security-risks-2026.html; }
  location = /blog/how-to-prepare-application-security-testing.html { return 301 /resources; }
  location = /blog/internal-vs-external-pen-testing.html { return 301 /resources; }
  location = /blog/owasp-top-10-explained.html { return 301 /security-hub/guides; }
  location = /blog/would-your-company-survive-ransomware-attack.html { return 301 /resources; }
  location = /resources/blogs { return 301 /resources; }
  location = /resources/white-papers { return 301 /resources; }
  location = /resources/case-studies { return 301 /resources; }

  location = /health {
    proxy_pass http://truva_backend/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://truva_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri/index.html $uri =404;
  }
}
