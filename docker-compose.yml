services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: local
        BUILD_SCRIPT: build
    container_name: truva-frontend
    restart: unless-stopped
    environment:
      COMMUNITY_ORIGIN: http://127.0.0.1:8888
    ports:
      - "8888:80"
    volumes:
      - community_data:/data
volumes:
  community_data:
    name: truva_community_data
