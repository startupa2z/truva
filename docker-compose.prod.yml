services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      COMMUNITY_ORIGIN: ${COMMUNITY_ORIGIN:-https://truvasolutions.com}
    ports:
      - "80:80"
    volumes:
      - community_data:/data

volumes:
  community_data:
